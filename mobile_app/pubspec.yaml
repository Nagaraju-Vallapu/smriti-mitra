name: smriti_mitra
description: >
  Smriti Mitra — an elderly-friendly cognitive care companion app with a
  linked caregiver experience. Frontend-only Flutter build; backend and
  ML are integrated later through GamePerformanceService's API boundary.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  provider: ^6.1.2
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0
  intl: 0.20.3

  # Optional profile photo (camera or gallery)
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  path: ^1.9.0

  # Current location for address field
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
